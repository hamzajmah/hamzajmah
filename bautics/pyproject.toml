[project]
name = "bautics"
version = "0.1.0"
description = "Bautics - KI-Agenten fuer den Infrastrukturbau. Phase 1: Baudoku-Agent + Wissensbank."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "jinja2>=3.1",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "python-multipart>=0.0.9",
    # Mind: Projektunterlagen einlesen
    "pypdf>=5.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62"]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
